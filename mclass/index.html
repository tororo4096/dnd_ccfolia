<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D クラス特徴早見表 ＆ マルチクラス計算機</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #c9a050;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #333333;
      --badge-bg: #2a2a3e;
      --badge-text: #8a99ad;
      --multiclass-bg: #181c24;
      --multiclass-border: #384458;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent-color);
    }

    h1 {
      color: var(--accent-color);
      font-size: 2rem;
      letter-spacing: 1.5px;
    }

    /* コントロールパネルエリア */
    .controls-wrapper {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
    }

    .panel-title {
      font-size: 1rem;
      color: var(--accent-color);
      margin-bottom: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .multiclass-builder {
      background-color: var(--multiclass-bg);
      border: 1px solid var(--multiclass-border);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .class-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .class-row:last-child {
      margin-bottom: 0;
    }

    .row-label {
      width: 70px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .btn {
      background-color: #2a2a2a;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #383838;
      border-color: var(--accent-color);
    }

    .btn-danger {
      background-color: #4a1f1f;
      color: #ff9999;
      border-color: #662222;
    }

    .btn-danger:hover {
      background-color: #662a2a;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 160px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    select, input {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent-color);
    }

    /* サマリーカードエリア */
    .summary-card {
      background-color: #181c24;
      border: 1px solid #2d3748;
      border-left: 4px solid var(--accent-color);
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 25px;
      display: none;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 10px;
    }

    .summary-item label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .summary-val {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* テーブル・早見表エリア */
    .class-section {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      overflow: hidden;
    }

    .class-header {
      background-color: #252525;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .class-title {
      font-size: 1.5rem;
      color: var(--accent-color);
    }

    .class-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-badge {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #3d3d5c;
    }

    .base-info-panel {
      background-color: #181818;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      font-size: 0.9rem;
    }

    .base-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 8px 20px;
    }

    .base-info-item span {
      color: var(--accent-color);
      font-weight: bold;
    }

    .base-info-item.full-width {
      grid-column: 1 / -1;
    }

    .tab-container {
      display: flex;
      background-color: #1a1a1a;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .tab-button {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-button.active {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
      background-color: var(--card-bg);
    }

    .tab-content {
      display: none;
      padding: 20px;
    }

    .tab-content.active {
      display: block;
    }

    .archetype-desc {
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #252525;
      color: var(--accent-color);
      font-weight: 600;
      white-space: nowrap;
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .level-col {
      width: 60px;
      text-align: center;
      font-weight: bold;
      color: var(--accent-color);
    }

    .name-col {
      width: 180px;
      font-weight: 600;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    mark {
      background-color: #c9a050;
      color: #121212;
      border-radius: 2px;
      padding: 0 2px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>D&D クラス特徴早見表 ＆ マルチクラス計算機</h1>
  </header>

  <div class="controls-wrapper">
    <div class="panel-title">⚔️ マルチクラス計算・構成設定</div>
    <div class="multiclass-builder">
      <!-- 主クラス設定 -->
      <div class="class-row">
        <span class="row-label">主クラス</span>
        <select id="primary-class" onchange="handleMulticlassChange()">
          <option value="">-- 未選択 --</option>
        </select>
        <label style="margin-left:8px; margin-bottom:0;">Lv:</label>
        <select class="class-level-select" id="primary-class-lvl" onchange="handleMulticlassChange()">
          <!-- JSで1-20生成 -->
        </select>
      </div>

      <!-- 副クラス動的追加コンテナ -->
      <div id="subclasses-container"></div>

      <div style="margin-top: 10px;">
        <button type="button" class="btn" onclick="addSubClassRow()">＋ 副クラスを追加</button>
      </div>
    </div>

    <!-- 検索＆パラメータエリア -->
    <div class="controls">
      <div class="control-group">
        <label for="con-mod">耐久力修正値 (CON)</label>
        <input type="number" id="con-mod" value="0" min="-5" max="10">
      </div>
      <div class="control-group">
        <label for="search-input">キーワード検索</label>
        <input type="text" id="search-input" placeholder="特徴名や解説文を検索...">
      </div>
    </div>
  </div>

  <!-- マルチクラス計算サマリー -->
  <div id="summary-card" class="summary-card">
    <div class="summary-grid">
      <div class="summary-item">
        <label>総キャラクターレベル</label>
        <div id="summary-total-lvl" class="summary-val">Lv 0</div>
      </div>
      <div class="summary-item">
        <label>習熟ボーナス</label>
        <div id="summary-prof-bonus" class="summary-val">+2</div>
      </div>
      <div class="summary-item">
        <label>合計体力 (合計HP)</label>
        <div id="summary-total-hp" class="summary-val">0</div>
      </div>
      <div class="summary-item">
        <label>実質キャスターレベル</label>
        <div id="summary-caster-lvl" class="summary-val">なし</div>
      </div>
    </div>
    <div id="multiclass-spell-slots" style="display:none; margin-top: 10px;">
      <label style="font-size: 0.8rem; color: var(--text-muted);">マルチクラス合算 呪文スロット</label>
      <table style="font-size: 0.85rem; text-align: center; margin-top: 4px;">
        <thead>
          <tr>
            <th>1Lv</th><th>2Lv</th><th>3Lv</th><th>4Lv</th><th>5Lv</th><th>6Lv</th><th>7Lv</th><th>8Lv</th><th>9Lv</th>
          </tr>
        </thead>
        <tbody>
          <tr id="multiclass-slots-row"></tr>
        </tbody>
      </table>
    </div>
  </div>

  <main id="app"></main>

  <script>
    const classData = [
      {
        "class_id": "wizard",
        "class_name": "ウィザード",
        "hit_die": 6,
        "hp_first_level": 6,
        "hp_subsequent_levels": 4,
        "caster_type": 1,
        "saving_throws": ["INT", "WIS"],
        "proficiencies": {
          "armor": "なし",
          "weapons": "ダガー、ダーツ、スリング、クオータースタッフ、ライト・クロスボウ",
          "tools": "なし"
        },
        "skill_choices": {
          "count": 2,
          "options": ["医術", "看破", "宗教", "捜査", "魔法学", "歴史"]
        },
        "equipment": [
          "（a）クオータースタッフ、または（b）ダガー",
          "（a）呪文構成要素ポーチ、または（b）秘術焦点具",
          "（a）学者パック、または（b）探険家パック",
          "呪文書"
        ],
        "asi_levels": [4, 8, 12, 16, 19],
        "archetype_level": 2,
        "archetype_title": "秘術の学派",
        "archetypes": [
          {
            "id": "illusion",
            "name": "幻術系統",
            "desc": "感覚を狂わせ、精神をまどわし、存在し得ないものをも実在するかのように見せる幻影の魔法を修める学派。",
            "features": [
              { "level": 2, "name": "幻術の専門家", "desc": "幻術呪文を呪文書に書き写すのに要する金銭と時間が半分になる。" },
              { "level": 2, "name": "マイナー・イリュージョン強化", "desc": "マイナー・イリュージョンを修得（習得済なら他の初級呪文1つ）。1回の発動で音と映像の両方を生み出せる。" },
              { "level": 6, "name": "可変幻影", "desc": "持続1分以上の幻術の持続中、アクションを用いてその幻の性質を変化させることができる。" },
              { "level": 10, "name": "幻影変り身", "desc": "攻撃を受けた際、リアクションで自身の幻を割り込ませ、攻撃を自動的にミスにできる（1回/小休憩または大休憩）。" },
              { "level": 14, "name": "実体ある幻影", "desc": "1レベル以上の幻術で生成した自律行動しない物体1個を、ボーナス・アクションで1分間実体化させられる（ダメージを与える等の害は不可）。" }
            ]
          },
          {
            "id": "conjuration",
            "name": "召喚術系統",
            "desc": "物体やクリーチャーを出現させたり、瞬間移動や次元間移動を自在に操る学派。",
            "features": [
              { "level": 2, "name": "召喚術の専門家", "desc": "召喚術呪文を呪文書に書き写すのに要する金銭と時間が半分になる。" },
              { "level": 2, "name": "小召喚", "desc": "アクションで1辺3ft・重量10lb以内の見覚えのある非魔法的物体1つを10ft以内に召喚する（1時間持続、ダメージ発生等で消滅）。" },
              { "level": 6, "name": "友好的位置交換", "desc": "アクションで30ft以内の空きスペースか、同意する小型/中型クリーチャーと位置を交換する（1回/大休憩、または1レベル以上の召喚術発動で回復）。" },
              { "level": 10, "name": "召喚術集中強化", "desc": "召喚術呪文への精神集中は、ダメージを受けても破れることがなくなる。" },
              { "level": 14, "name": "頑丈な召喚クリーチャー", "desc": "召喚術呪文で召喚または創造したクリーチャーは、すべて30の一時的ヒット・ポイントを得る。" }
            ]
          },
          {
            "id": "necromancy",
            "name": "死霊術系統",
            "desc": "生と死、知識、知識、そしてアンデッドの力を操作し、生命力を奪い取って自らの魔力へと変える学派。",
            "features": [
              { "level": 2, "name": "死霊術の専門家", "desc": "死霊術呪文を呪文書に書き写すのに要する金銭と時間が半分になる。" },
              { "level": 2, "name": "生命刈り取り", "desc": "1レベル以上の呪文で敵を倒した際、(呪文レベル×2) HPを回復（死霊術なら(呪文レベル×3) HP回復）。人造・アンデッドには無効。" },
              { "level": 6, "name": "アンデッド使い", "desc": "アニメイト・デッドを修得。発動時に作成できるアンデッドが1体増加し、生成されたアンデッドは最大HP（+ウィザードLv）と武器ダメージ（+習熟ボーナス）が増加する。" },
              { "level": 10, "name": "アンデッド慣れ", "desc": "[死霊]ダメージ抵抗を得る。また、最大HPの減少効果を受けなくなる。" },
              { "level": 14, "name": "アンデッド支配", "desc": "60ft以内のアンデッド1体をアクションで【魅力】セーヴさせ、失敗時に支配下に置く（知性判定で毎時再セーヴの可能性あり）。" }
            ]
          },
          {
            "id": "enchantment",
            "name": "心術系統",
            "desc": "他者の精神に働きかけ、魅了や記憶の操作によって屈服または誘導する学派。",

            "name": "占術系統",
            "desc": "時間・空間・意識のヴェールを見通し、過去・現在・未来の知識を得る学派。",
            "features": [
              { "level": 2, "name": "占術の専門家", "desc": "占術呪文を呪文書に書き写すのに要する金銭と時間が半分になる。" },
              { "level": 2, "name": "予見", "desc": "大休憩ごとにd20を2回振り記録する。自分または見えている目標の攻撃/セーヴ/能力値判定の出目を、そのダイス結果と差し替えることができる。" },

              { "level": 14, "name": "予見強化", "desc": "「予見」で記録するd20の数が2個から3個に増加する。" }
            ]
          },
          {
            "id": "transmutation",
            "name": "変成術系統",
            "desc": "エネルギーと物質の形態や性情を変化させ、物体や生命を作り変える学派。",
            "features": [
              { "level": 2, "name": "変成術の専門家", "desc": "変成術呪文を呪文書に書き写すのに要する金銭と時間が半分になる。" },

    function getMulticlassConfig() {
      const primaryId = document.getElementById('primary-class').value;
      const primaryLvl = parseInt(document.getElementById('primary-class-lvl').value, 10) || 1;

      if (!primaryId) {
        return { isMulticlassActive: false, primaryId: '', totalLevel: 0, classes: {}, subClasses: {} };
      }

      const classes = {};
      const subClasses = {};
      classes[primaryId] = primaryLvl;

      const subRows = document.querySelectorAll('.sub-class-row');
      subRows.forEach(row => {
        const subId = row.querySelector('.sub-class-id').value;
        const subLvl = parseInt(row.querySelector('.sub-class-lvl').value, 10) || 1;
        if (subId) {
          classes[subId] = (classes[subId] || 0) + subLvl;
          subClasses[subId] = (subClasses[subId] || 0) + subLvl;
        }
      });

      let totalLevel = 0;
      Object.values(classes).forEach(lvl => totalLevel += lvl);

      return {
        isMulticlassActive: true,
        primaryId,
        totalLevel,
        classes,
        subClasses
      };
    }

    window.handleMulticlassChange = function() {
      const config = getMulticlassConfig();
      const summaryCard = document.getElementById('summary-card');
      const conMod = parseInt(conModInput.value, 10) || 0;

      if (config.isMulticlassActive) {
        summaryCard.style.display = 'block';

        document.getElementById('summary-total-lvl').textContent = `Lv ${config.totalLevel}`;
        const profBonus = Math.ceil(1 + (config.totalLevel / 4));
        document.getElementById('summary-prof-bonus').textContent = `+${profBonus}`;

        let totalHp = 0;
        Object.entries(config.classes).forEach(([cId, cLvl]) => {
          const cls = classData.find(c => c.class_id === cId);
          if (cls && cLvl > 0) {
            if (cId === config.primaryId) {
              totalHp += cls.hp_first_level + (cls.hp_subsequent_levels * (cLvl - 1));
            } else {
              totalHp += cls.hp_subsequent_levels * cLvl;
            }
          }
        });
        totalHp += conMod * config.totalLevel;
        document.getElementById('summary-total-hp').textContent = totalHp;

        let casterLvlSum = 0;
        Object.entries(config.classes).forEach(([cId, cLvl]) => {
          const cls = classData.find(c => c.class_id === cId);
          if (cls) {
            let type = cls.caster_type || 0;
            const selectedArch = selectedArchetypes[cId];
            if (selectedArch === 'eldritch_knight' || selectedArch === 'arcane_trickster') {
              type = 0.3333;
            }
            casterLvlSum += cLvl * type;
          }
        });

        const effectiveCasterLvl = Math.floor(casterLvlSum);
        const casterLvlEl = document.getElementById('summary-caster-lvl');
        const slotsContainer = document.getElementById('multiclass-spell-slots');
        const slotsRow = document.getElementById('multiclass-slots-row');

        if (effectiveCasterLvl > 0) {
          casterLvlEl.textContent = `Lv ${effectiveCasterLvl}`;
          slotsContainer.style.display = 'block';
          const slots = multiclassSpellSlotsTable[Math.min(effectiveCasterLvl, 20) - 1];
          slotsRow.innerHTML = slots.map(s => `<td>${s > 0 ? s : '―'}</td>`).join('');
        } else {
          casterLvlEl.textContent = "なし";
          slotsContainer.style.display = 'none';
        }

      } else {
        summaryCard.style.display = 'none';
      }

      render();
    };

    function highlightText(text, queries) {
      if (!queries || queries.length === 0 || !text) return text;
      const pattern = queries
        .filter(q => q.length > 0)
        .map(q => q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
        .join('|');
      if (!pattern) return text;
      const regex = new RegExp(`(${pattern})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    function createFeatureRows(features, maxLevel, rawQuery) {
      const queries = rawQuery ? rawQuery.trim().toLowerCase().split(/\s+/).filter(Boolean) : [];
      return features
        .filter(f => {
          if (f.level > maxLevel) return false;
          if (queries.length === 0) return true;
          const targetText = (f.name + ' ' + f.desc).toLowerCase();
          return queries.every(q => targetText.includes(q));
        })
        .map(f => {
          return `
            <tr>
              <td class="level-col">${f.level}</td>
              <td class="name-col">${highlightText(f.name, queries)}</td>
              <td>${highlightText(f.desc, queries)}</td>
            </tr>
          `;
        }).join('');
    }

    window.handleArchetypeChange = function(classId, value) {
      selectedArchetypes[classId] = value;
      handleMulticlassChange();
    };

    function render() {
      const config = getMulticlassConfig();

      const query = searchInput.value.trim().toLowerCase();

      app.innerHTML = '';
      let hasResults = false;

      classData.forEach(c => {
        // ★修正点: 選択されていないクラス（Levelが0以下）は画面に一切描画しない
        const currentLevel = config.classes[c.class_id] || 0;
        if (currentLevel <= 0) {
          return;
        }

        const selectedArchetypeId = selectedArchetypes[c.class_id] || '';
        const selectedArchetype = c.archetypes.find(a => a.id === selectedArchetypeId);

        let combinedFeatures = [...c.features];
        if (selectedArchetype) {
          const archetypeFeatures = selectedArchetype.features.map(f => ({
            ...f,
            name: `${f.name}<br>[${selectedArchetype.name}]`
          }));
          combinedFeatures = combinedFeatures.concat(archetypeFeatures);
        }
        combinedFeatures.sort((a, b) => a.level - b.level);

        const baseRows = createFeatureRows(combinedFeatures, currentLevel, query);

        const archetypeHtmls = c.archetypes.map(a => {
          const rows = createFeatureRows(a.features, currentLevel, query);
          if (!rows && query) return null;
          return { id: a.id, name: a.name, desc: a.desc, rows: rows };
        }).filter(Boolean);

        let stylesHtml = '';
        if (c.fighting_styles) {
          const queries = query ? query.trim().toLowerCase().split(/\s+/).filter(Boolean) : [];
          const filteredStyles = c.fighting_styles.filter(s => {
            if (queries.length === 0) return true;
            return queries.every(q => (s.name + ' ' + s.desc).toLowerCase().includes(q));
          });
          if (filteredStyles.length > 0) {
            stylesHtml = filteredStyles.map(s => `
              <tr>
                <td class="level-col">1</td>
                <td class="name-col">[スタイル] ${highlightText(s.name, queries)}</td>
                <td>${highlightText(s.desc, queries)}</td>
              </tr>
            `).join('');
          }
        }

        hasResults = true;

        const section = document.createElement('div');
        section.className = 'class-section';

        const metaInfo = `<span class="meta-badge">能力値上昇Lv: ${c.asi_levels.join(', ')}</span>`;
        
        let hpLabel = "体力";
        let hpValStr = "―";

        if (c.class_id === config.primaryId) {
          hpLabel = "主クラス体力";
          const hpVal = c.hp_first_level + conMod + (c.hp_subsequent_levels + conMod) * Math.max(0, currentLevel - 1);
          hpValStr = `${hpVal}`;
        } else if (config.subClasses && config.subClasses[c.class_id]) {
          hpLabel = "副クラス体力";
          const hpVal = (c.hp_subsequent_levels + conMod) * currentLevel;
          hpValStr = `${hpVal}`;
        }

        const hitDiceStr = `${currentLevel}d${c.hit_die}`;

        let spellcastingInfoHtml = '';
        if (c.class_id === 'wizard') {
          spellcastingInfoHtml = `
            <div class="base-info-item full-width">呪文のセーヴ難易度： <span>8 ＋ 習熟ボーナス ＋ 知力修正値</span></div>
            <div class="base-info-item full-width">呪文攻撃の修正値： <span>習熟ボーナス ＋ 知力修正値</span></div>
            <div class="base-info-item full-width">準備呪文の数： <span>知力修正値 ＋ ウィザード・レベル</span></div>
          `;
        } else if (c.class_id === 'cleric') {
          spellcastingInfoHtml = `
            <div class="base-info-item full-width">呪文のセーヴ難易度： <span>8 ＋ 習熟ボーナス ＋ 判断力修正値</span></div>
            <div class="base-info-item full-width">呪文攻撃の修正値： <span>習熟ボーナス ＋ 判断力修正値</span></div>
            <div class="base-info-item full-width">準備呪文の数： <span>判断力修正値 ＋ クレリック・レベル</span></div>
          `;
        }

        const archetypeOptionsHtml = `
          <option value="" ${selectedArchetypeId === '' ? 'selected' : ''}>基本特徴のみ</option>
          ${c.archetypes.map(a => `<option value="${a.id}" ${a.id === selectedArchetypeId ? 'selected' : ''}>${a.name}</option>`).join('')}
        `;

        const baseInfoPanel = `
          <div class="base-info-panel">
            <div class="base-info-grid">
              <div class="base-info-item">${hpLabel}: <span>${hpValStr}</span></div>
              <div class="base-info-item">ヒット・ダイス： <span>${hitDiceStr}</span></div>
              <div class="base-info-item">習熟セーヴ： <span>${c.saving_throws.join(', ')}</span></div>
              <div class="base-info-item">鎧習熟： <span>${c.proficiencies ? c.proficiencies.armor : '―'}</span></div>
              <div class="base-info-item">武器習熟： <span>${c.proficiencies ? c.proficiencies.weapons : '―'}</span></div>
              <div class="base-info-item">道具習熟： <span>${c.proficiencies ? c.proficiencies.tools : '―'}</span></div>
              <div class="base-info-item full-width">技能一覧： 次の中から<span>${c.skill_choices.count}</span>個選択 (${c.skill_choices.options.join('、')})</div>
              ${spellcastingInfoHtml}
            </div>
          </div>
        `;

        let tabsNav = `<button class="tab-button active" onclick="switchTab(event, '${c.class_id}', 'base')">基本特徴</button>`;
        if (stylesHtml) {
          tabsNav += `<button class="tab-button" onclick="switchTab(event, '${c.class_id}', 'styles')">戦闘スタイル</button>`;
        }
        archetypeHtmls.forEach(a => {
          tabsNav += `<button class="tab-button" onclick="switchTab(event, '${c.class_id}', '${a.id}')">${a.name}</button>`;
        });

        let tabsContent = `
          <div id="${c.class_id}-base" class="tab-content active">
            ${baseInfoPanel}
            <table>
              <thead>
                <tr>
                  <th>Lv</th>
                  <th>特徴名</th>
                  <th>
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                      <span>効果・解説</span>
                      <div style="display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 0.85rem;">
                        <label for="archetype-select-${c.class_id}" style="margin: 0; color: var(--text-muted); white-space: nowrap;">追加表示(${c.archetype_title}):</label>
                        <select id="archetype-select-${c.class_id}" onchange="handleArchetypeChange('${c.class_id}', this.value)" onclick="event.stopPropagation()" style="padding: 4px 8px; font-size: 0.85rem; background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px;">
                          ${archetypeOptionsHtml}
                        </select>
                      </div>
                    </div>
                  </th>
                </tr>
              </thead>
              <tbody>${baseRows || '<tr><td colspan="3" class="no-results">このレベル以下で取得可能な特徴はありません</td></tr>'}</tbody>
            </table>
          </div>
        `;

        if (stylesHtml) {
          tabsContent += `
            <div id="${c.class_id}-styles" class="tab-content">
              <table>
                <thead><tr><th>Lv</th><th>スタイル名</th><th>効果・解説</th></tr></thead>
                <tbody>${stylesHtml}</tbody>
              </table>
            </div>
          `;
        }

        archetypeHtmls.forEach(a => {
          tabsContent += `
            <div id="${c.class_id}-${a.id}" class="tab-content">
              <div class="archetype-desc">${a.desc}</div>
              <table>
                <thead><tr><th>Lv</th><th>特徴名</th><th>効果・解説</th></tr></thead>
                <tbody>${a.rows || '<tr><td colspan="3" class="no-results">このレベル以下で取得可能な特徴はありません</td></tr>'}</tbody>
              </table>
            </div>
          `;
        });

        section.innerHTML = `
          <div class="class-header">
            <h2 class="class-title">${c.class_name} <span style="font-size:1rem;">(Lv ${currentLevel})</span></h2>
            <div class="class-meta">${metaInfo}</div>
          </div>
          <div class="tab-container">${tabsNav}</div>
          ${tabsContent}
        `;

        app.appendChild(section);
      });

      if (!hasResults) {
        app.innerHTML = '<div class="no-results">主クラスまたは副クラスを選択してください。</div>';
      }
    }

    window.switchTab = function(event, classId, tabType) {
      const container = event.target.closest('.class-section');
      container.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      container.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      const targetTab = container.querySelector(`#${classId}-${tabType}`);
      if (targetTab) {
        targetTab.classList.add('active');
      }
    };

    conModInput.addEventListener('input', handleMulticlassChange);
    searchInput.addEventListener('input', render);

    initFilters();
    handleMulticlassChange();
  </script>
</body>
</html>
