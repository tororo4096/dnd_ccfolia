<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D 5e キャラクター保管庫 → ココフォリア駒変換ツール</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--accent-color);
    }

    p.description {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      height: 250px;
      background-color: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      box-sizing: border-box;
    }

    textarea:focus {
      outline: 2px solid var(--accent-color);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    button {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .message {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: bold;
      color: #4ade80;
      min-height: 1.5em;
    }

    .instructions {
      background-color: rgba(56, 189, 248, 0.05);
      border-left: 4px solid var(--accent-color);
      padding: 1rem;
      margin-top: 2rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
    }

    .instructions ol {
      margin: 0.5rem 0 0 1.2rem;
      padding: 0;
    }
  </style>
</head>
<body>

  <h1>D&D 5e キャラクター保管庫 → ココフォリア 駒変換</h1>
  <p class="description">キャラクター保管庫から出力したテキスト（チャットパレット）を貼るだけで、ココフォリアで読み込める駒データ（JSON）を作成・コピーします。</p>

  <div class="container">
    <div class="card">
      <label for="inputText">1. キャラクター保管庫のテキストを貼り付け</label>
      <textarea id="inputText" placeholder="■チャットパレット:ボイェーツ・ワグネル..."></textarea>
      
      <div class="btn-group">
        <button id="convertBtn">ココフォリア用JSONをコピー</button>
      </div>
      <div id="statusMsg" class="message"></div>
    </div>
  </div>

  <div class="instructions">
    <strong>使いかた：</strong>
    <ol>
      <li>キャラクター保管庫の「パレット出力」テキストを上の枠に貼り付けます。</li>
      <li>「ココフォリア用JSONをコピー」ボタンを押します。</li>
      <li>ココフォリアの部屋画面を開き、盤面上（またはマップ上）で <strong>Ctrl + V</strong> (Macは Command + V) を押すと駒が生成されます。</li>
    </ol>
  </div>

  <script>
    // テキストから数値を抽出するヘルパー関数
    function extractValue(text, pattern, defaultValue = 0) {
      const match = text.match(pattern);
      return match ? parseInt(match[1], 10) : defaultValue;
    }

    // チャットパレットテキストをパースしてココフォリア用JSONに変換する関数
    function parseToCcfoliaJson(rawText) {
      // 1. キャラクター名の抽出
      const nameMatch = rawText.match(/■チャットパレット:([^\r\n]+)/);
      const name = nameMatch ? nameMatch[1].trim() : "名称未設定";

      // 2. メモ（レベル・種族・クラス等）の抽出
      const memoMatch = rawText.match(/■レベル:([^\r\n]+)/);
      const memo = memoMatch ? memoMatch[1].trim() : "";

      // 3. ステータス値のパース
      // イニシアチブ (例: 1d20+2 ▼イニシアチブ)
      const initiativeMatch = rawText.match(/1d20([+-]\d+)\s*▼イニシアチブ/);
      const initiative = initiativeMatch ? parseInt(initiativeMatch[1], 10) : 0;

      // AC (例: ▼AC:18)
      const ac = extractValue(rawText, /▼AC:(\d+)/, 10);

      // HP (例: ▼HP:13/13)
      const hpMatch = rawText.match(/▼HP:(\d+)\/(\d+)/);
      const currentHp = hpMatch ? parseInt(hpMatch[1], 10) : 0;
      const maxHp = hpMatch ? parseInt(hpMatch[2], 10) : 0;

      // 移動速度 (例: ▼移動速度:30ft./6sq. -> 30)
      const speed = extractValue(rawText, /▼移動速度:(\d+)ft/, 30);

      // 4. ココフォリア用データ構造の組み立て
      const ccfoliaData = {
        kind: "character",
        data: {
          name: name,
          memo: memo,
          initiative: initiative,
          externalUrl: "",
          status: [
            { label: "HP", value: currentHp, max: maxHp },
            { label: "AC", value: ac, max: ac },
            { label: "移動速度", value: speed, max: speed }
          ],
          params: [],
          commands: rawText.trim()
        }
      };

      return ccfoliaData;
    }

    // イベントリスナーの設定
    document.getElementById('convertBtn').addEventListener('click', async () => {
      const inputText = document.getElementById('inputText').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!inputText.trim()) {
        statusMsg.style.color = '#f87171'; // 赤色
        statusMsg.textContent = 'テキストを入力してください。';
        return;
      }

      try {
        const jsonOutput = parseToCcfoliaJson(inputText);
        const jsonString = JSON.stringify(jsonOutput, null, 2);

        // クリップボードへ書き込み
        await navigator.clipboard.writeText(jsonString);

        statusMsg.style.color = '#4ade80'; // 緑色
        statusMsg.textContent = '✓ クリップボードにコピーしました！ココフォリア上で Paste (Ctrl+V) してください。';
      } catch (err) {
        console.error(err);
        statusMsg.style.color = '#f87171';
        statusMsg.textContent = '変換に失敗しました。テキストフォーマットを確認してください。';
      }
    });
  </script>
</body>
</html>
