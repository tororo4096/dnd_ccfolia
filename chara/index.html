<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e キャラクタービルダー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>D&D 5e キャラクタービルダー</h1>
        <div class="header-info">
            <span>クラス: <strong>ファイター</strong></span>
        </div>
    </header>

    <main class="container">
        <!-- 種族選択セクション -->
        <section class="card race-section">
            <h2>種族選択</h2>
            <div class="race-control">
                <label for="race-select">種族 / 亜種族:</label>
                <select id="race-select" class="style-select"></select>
            </div>
            <!-- ハーフエルフ用任意能力値選択枠 -->
            <div id="half-elf-bonus-group" class="half-elf-group hidden">
                <p class="sub-text">【ハーフエルフ特徴】魅力以外で+1する能力値を2つ選択してください:</p>
                <select id="he-stat-1" class="he-select"></select>
                <select id="he-stat-2" class="he-select"></select>
            </div>
        </section>

        <!-- 既存のレベル設定などの近くに追加 -->
        <div class="form-group">
            <label for="class-select">クラス:</label>
            <select id="class-select" class="form-control">
                <!-- app.js の renderClassSelect() でファイター/ローグが自動描画されます -->
            </select>
        </div>

        <!-- 基本パラメータ設定 -->
        <section class="card level-section">
            <h2>キャラクターレベル設定</h2>
            <div class="level-control">
                <label for="level-slider">レベル: <span id="level-disp">1</span></label>
                <input type="range" id="level-slider" min="1" max="20" value="1">
            </div>
            <div class="level-stats">
                <div class="stat-badge">習熟ボーナス: <strong id="prof-bonus">+2</strong></div>
                <div class="stat-badge">移動速度: <strong id="speed-disp">30ft</strong></div>
                <div class="stat-badge">推算HP: <strong id="hp-disp">10</strong></div>
            </div>
        </section>

        <div class="grid-layout">
            <!-- 左カラム -->
            <div class="column">
                <section class="card">
                    <h2>能力値 (ポイント買収法: <span id="pts-left">27</span> / 27 pt)</h2>
                    <table class="ability-table">
                        <thead>
                            <tr>
                                <th>能力値</th>
                                <th>ベース</th>
                                <th>種族補正</th>
                                <th>ASI/特技</th>
                                <th>最終値</th>
                                <th>修正値</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="ability-rows"></tbody>
                    </table>
                </section>

                <section class="card">
                    <h2>クラス技能選択 (2つ選択)</h2>
                    <div id="skills-list" class="checkbox-grid"></div>
                </section>

                <section class="card">
                    <h2>戦闘スタイル選択</h2>
                    <div class="style-select-group">
                        <label for="style-1">1レベル戦闘スタイル:</label>
                        <select id="style-1" class="style-select"></select>
                    </div>
                    <div id="style-2-group" class="style-select-group hidden">
                        <label for="style-2">10レベル戦闘スタイル追加 (チャンピオン):</label>
                        <select id="style-2" class="style-select"></select>
                    </div>
                </section>

                <!-- サブクラス選択セクション -->
                <section class="card id="archetype-card">
                    <h2>戦士の類型 (サブクラス)</h2>
                    <div class="style-select-group">
                        <label for="archetype-select">3レベルで解放される類型:</label>
                        <select id="archetype-select" class="style-select"></select>
                    </div>
                    <div id="archetype-desc" class="sub-text" style="margin-top:8px;"></div>
                </section>
            </div>

            <!-- 右カラム -->
            <div class="column">
                <section class="card" id="asi-card">
                    <h2>能力値上昇 (ASI) 選択</h2>
                    <div id="asi-container"></div>
                </section>

                <section class="card">
                    <h2>種族特徴 & 習熟一覧</h2>
                    <div id="race-traits-list" class="timeline"></div>
                </section>

                <section class="card">
                    <h2>獲得できるクラス特徴一覧</h2>
                    <div id="features-list" class="timeline"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
