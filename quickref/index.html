<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D クラス特徴早見表</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #c9a050;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #333333;
      --badge-bg: #2a2a3e;
      --badge-text: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent-color);
    }

    h1 {
      color: var(--accent-color);
      font-size: 2rem;
      letter-spacing: 1.5px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 180px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    select, input {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent-color);
    }

    .class-section {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 30px;
      overflow: hidden;
    }

    .class-header {
      background-color: #252525;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .class-title {
      font-size: 1.5rem;
      color: var(--accent-color);
    }

    .class-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-badge {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #3d3d5c;
    }

    .base-info-panel {
      background-color: #181818;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 20px;
      font-size: 0.9rem;
    }

    .base-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 8px 20px;
    }

    .base-info-item span {
      color: var(--accent-color);
      font-weight: bold;
    }

    .base-info-item.full-width {
      grid-column: 1 / -1;
    }

    .equipment-list {
      margin-top: 4px;
      padding-left: 20px;
      color: var(--text-color);
    }

    .tab-container {
      display: flex;
      background-color: #1a1a1a;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .tab-button {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-button.active {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
      background-color: var(--card-bg);
    }

    .tab-content {
      display: none;
      padding: 20px;
    }

    .tab-content.active {
      display: block;
    }

    .archetype-desc {
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #252525;
      color: var(--accent-color);
      font-weight: 600;
      white-space: nowrap;
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .level-col {
      width: 60px;
      text-align: center;
      font-weight: bold;
      color: var(--accent-color);
    }

    .name-col {
      width: 180px;
      font-weight: 600;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    /* 検索キーワードのハイライト用スタイル */
    mark {
      background-color: #c9a050;
      color: #121212;
      border-radius: 2px;
      padding: 0 2px;
      font-weight: bold;
    }
  </style>
</head>

  // テキスト内の指定キーワードを<mark>で囲むヘルパー関数
  function highlightText(text, queries) {
    if (!queries || queries.length === 0 || !text) return text;
    const pattern = queries
      .filter(q => q.length > 0)
      .map(q => q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
      .join('|');
    if (!pattern) return text;
    
    const regex = new RegExp(`(${pattern})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function createFeatureRows(features, maxLevel, rawQuery) {
    const queries = rawQuery ? rawQuery.trim().toLowerCase().split(/\s+/).filter(Boolean) : [];

    return features
      .filter(f => {
        const matchLevel = f.level <= maxLevel;
        if (!matchLevel) return false;
        if (queries.length === 0) return true;

        const targetText = (f.name + ' ' + f.desc).toLowerCase();
        return queries.every(q => targetText.includes(q));
      })
      .map(f => {
        const highlightedName = highlightText(f.name, queries);
        const highlightedDesc = highlightText(f.desc, queries);

        return `
          <tr>
            <td class="level-col">${f.level}</td>
            <td class="name-col">${highlightedName}</td>
            <td>${highlightedDesc}</td>
          </tr>
        `;
      }).join('');
  }

    { cantrips: 3, slots: [2, 0, 0, 0, 0, 0, 0, 0, 0] },
    { cantrips: 3, slots: [3, 0, 0, 0, 0, 0, 0, 0, 0] },
    { cantrips: 3, slots: [4, 2, 0, 0, 0, 0, 0, 0, 0] },
    { cantrips: 4, slots: [4, 3, 0, 0, 0, 0, 0, 0, 0] },
    { cantrips: 4, slots: [4, 3, 2, 0, 0, 0, 0, 0, 0] },
    { cantrips: 4, slots: [4, 3, 3, 0, 0, 0, 0, 0, 0] },
    { cantrips: 4, slots: [4, 3, 3, 1, 0, 0, 0, 0, 0] },
    { cantrips: 4, slots: [4, 3, 3, 2, 0, 0, 0, 0, 0] },
    { cantrips: 4, slots: [4, 3, 3, 3, 1, 0, 0, 0, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 0, 0, 0, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 1, 0, 0, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 1, 0, 0, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 1, 1, 0, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 1, 1, 0, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 1, 1, 1, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 1, 1, 1, 0] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 1, 1, 1, 1] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 2, 1, 1, 1] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 2, 1, 1, 1] },
    { cantrips: 5, slots: [4, 3, 3, 3, 2, 2, 2, 1, 1] }
  ];

  const warlockSpellSlotsData = [
    { cantrips: 2, known: 2,  slots: 1, slotLevel: 1, invocations: 0 },
    { cantrips: 2, known: 3,  slots: 2, slotLevel: 1, invocations: 2 },
    { cantrips: 2, known: 4,  slots: 2, slotLevel: 2, invocations: 2 },
    { cantrips: 3, known: 5,  slots: 2, slotLevel: 2, invocations: 2 },
    { cantrips: 3, known: 6,  slots: 2, slotLevel: 3, invocations: 3 },
    { cantrips: 3, known: 7,  slots: 2, slotLevel: 3, invocations: 3 },
    { cantrips: 3, known: 8,  slots: 2, slotLevel: 4, invocations: 4 },
    { cantrips: 3, known: 9,  slots: 2, slotLevel: 4, invocations: 4 },
    { cantrips: 3, known: 10, slots: 2, slotLevel: 5, invocations: 5 },
    { cantrips: 4, known: 10, slots: 2, slotLevel: 5, invocations: 5 },
    { cantrips: 4, known: 11, slots: 3, slotLevel: 5, invocations: 5 },
    { cantrips: 4, known: 11, slots: 3, slotLevel: 5, invocations: 6 },
    { cantrips: 4, known: 12, slots: 3, slotLevel: 5, invocations: 6 },
    { cantrips: 4, known: 12, slots: 3, slotLevel: 5, invocations: 6 },
    { cantrips: 4, known: 13, slots: 3, slotLevel: 5, invocations: 7 },
    { cantrips: 4, known: 13, slots: 3, slotLevel: 5, invocations: 7 },
    { cantrips: 4, known: 14, slots: 4, slotLevel: 5, invocations: 7 },
    { cantrips: 4, known: 14, slots: 4, slotLevel: 5, invocations: 8 },
    { cantrips: 4, known: 15, slots: 4, slotLevel: 5, invocations: 8 },
    { cantrips: 4, known: 15, slots: 4, slotLevel: 5, invocations: 8 }
  ];


  // ドロップダウン変更時に呼び出される関数
  window.handleArchetypeChange = function(classId, value) {
    selectedArchetypes[classId] = value;
    render();
  };

  function render() {
    const selectedClass = classFilter.value;
    const currentLevel = parseInt(levelFilter.value, 10);
    const conMod = parseInt(conModInput.value, 10) || 0;
    const query = searchInput.value.trim().toLowerCase();

    app.innerHTML = '';
    let hasResults = false;

    classData.forEach(c => {
      if (selectedClass !== 'all' && c.class_id !== selectedClass) return;

      // 保存された選択値を取得
      const selectedArchetypeId = selectedArchetypes[c.class_id] || '';
      const selectedArchetype = c.archetypes.find(a => a.id === selectedArchetypeId);

      // --- 基本特徴タブ用：基本特徴 ＋ 選択されたサブクラス特徴を統合・ソート ---
      let combinedFeatures = [...c.features];
      if (selectedArchetype) {
        const archetypeFeatures = selectedArchetype.features.map(f => ({
          ...f,
          name: `${f.name}<br>[${selectedArchetype.name}]`
        }));
        combinedFeatures = combinedFeatures.concat(archetypeFeatures);
      }
      combinedFeatures.sort((a, b) => a.level - b.level);

      const baseRows = createFeatureRows(combinedFeatures, currentLevel, query);

      // --- 個別タブ用 ---
      const archetypeHtmls = c.archetypes.map(a => {
        const rows = createFeatureRows(a.features, currentLevel, query);
        if (!rows && query) return null;

        return {
          id: a.id,
          name: a.name,
          desc: a.desc,
          rows: rows
        };
      }).filter(Boolean);

      // --- 戦闘スタイル ---
      let stylesHtml = '';
      if (c.fighting_styles) {
        const queries = query ? query.trim().toLowerCase().split(/\s+/).filter(Boolean) : [];
        const filteredStyles = c.fighting_styles.filter(s => {
          if (queries.length === 0) return true;
          const targetText = (s.name + ' ' + s.desc).toLowerCase();
          return queries.every(q => targetText.includes(q));
        });

        if (filteredStyles.length > 0) {
          stylesHtml = filteredStyles.map(s => `
            <tr>
              <td class="level-col">1</td>
              <td class="name-col">[スタイル] ${highlightText(s.name, queries)}</td>
              <td>${highlightText(s.desc, queries)}</td>
            </tr>
          `).join('');
        }
      }

      if (!baseRows && archetypeHtmls.length === 0 && !stylesHtml) return;

      hasResults = true;

      const section = document.createElement('div');
      section.className = 'class-section';

      const metaInfo = `<span class="meta-badge">能力値上昇Lv: ${c.asi_levels.join(', ')}</span>`;

      const hpMain = c.hp_first_level + conMod + (c.hp_subsequent_levels + conMod) * (currentLevel - 1);
      const hpSub = (c.hp_subsequent_levels + conMod) * currentLevel;
      const hitDiceStr = `${currentLevel}d${c.hit_die}`;

      // 呪文情報の生成処理
      let spellcastingInfoHtml = '';
      if (c.class_id === 'wizard') {
        const learnedSpells = 6 + 2 * (currentLevel - 1);
        const currentData = wizardSpellSlotsData[currentLevel - 1];
        const slotsCells = currentData.slots.map(s => `<td>${s > 0 ? s : '―'}</td>`).join('');
        const calcMaxSpell = (calcVal) => (calcVal > 0 ? `≤${calcVal}` : '―');
        const learnedByLevel = [
          calcMaxSpell(6 + (currentLevel - 1) * 2),
          calcMaxSpell((currentLevel - 2) * 2),
          calcMaxSpell((currentLevel - 4) * 2),
          calcMaxSpell((currentLevel - 6) * 2),
          calcMaxSpell((currentLevel - 8) * 2),
          calcMaxSpell((currentLevel - 10) * 2),
          calcMaxSpell((currentLevel - 12) * 2),
          calcMaxSpell((currentLevel - 14) * 2),
          calcMaxSpell((currentLevel - 16) * 2)
        ];
        const learnedCells = learnedByLevel.map(val => `<td>${val}</td>`).join('');

        spellcastingInfoHtml = `
          <div class="base-info-item full-width">呪文のセーヴ難易度： <span>8 ＋ 習熟ボーナス ＋ 知力修正値</span></div>
          <div class="base-info-item full-width">呪文攻撃の修正値： <span>習熟ボーナス ＋ 知力修正値</span></div>
          <div class="base-info-item full-width">準備呪文の数： <span>知力修正値 ＋ ウィザード・レベル</span></div>
          <div class="base-info-item full-width">1Lv.以上の合計呪文修得数： <span>${learnedSpells}</span></div>
          <div class="base-info-item full-width" style="margin-top: 8px;">
            <strong style="color: var(--accent-color);">Lv.${currentLevel} 呪文スロット表</strong>
            <table style="margin-top: 5px; font-size: 0.85rem; text-align: center;">
              <thead>
                <tr>
                  <th>初級呪文修得数</th>
                  <th>1Lv</th><th>2Lv</th><th>3Lv</th><th>4Lv</th><th>5Lv</th><th>6Lv</th><th>7Lv</th><th>8Lv</th><th>9Lv</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${currentData.cantrips}</td>
                  ${slotsCells}
                </tr>
              </tbody>
            </table>
          </div>
          <div class="base-info-item full-width" style="margin-top: 8px;">
            <strong style="color: var(--accent-color);">Lv.${currentLevel} 呪文修得数上限表</strong>
            <table style="margin-top: 5px; font-size: 0.85rem; text-align: center;">
              <thead>
                <tr>
                  <th>1Lv</th><th>2Lv</th><th>3Lv</th><th>4Lv</th><th>5Lv</th><th>6Lv</th><th>7Lv</th><th>8Lv</th><th>9Lv</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  ${learnedCells}
                </tr>
              </tbody>
            </table>
          </div>
        `;
      } else if (c.class_id === 'cleric') {
        const currentData = clericSpellSlotsData[currentLevel - 1];
        const slotsCells = currentData.slots.map(s => `<td>${s > 0 ? s : '―'}</td>`).join('');

        spellcastingInfoHtml = `
          <div class="base-info-item full-width">呪文のセーヴ難易度： <span>8 ＋ 習熟ボーナス ＋ 判断力修正値</span></div>
          <div class="base-info-item full-width">呪文攻撃の修正値： <span>習熟ボーナス ＋ 判断力修正値</span></div>
          <div class="base-info-item full-width">準備呪文の数： <span>判断力修正値 ＋ クレリック・レベル</span></div>
          <div class="base-info-item full-width" style="margin-top: 8px;">
            <strong style="color: var(--accent-color);">Lv.${currentLevel} 呪文スロット表</strong>
            <table style="margin-top: 5px; font-size: 0.85rem; text-align: center;">
              <thead>
                <tr>
                  <th>初級呪文修得数</th>
                  <th>1Lv</th><th>2Lv</th><th>3Lv</th><th>4Lv</th><th>5Lv</th><th>6Lv</th><th>7Lv</th><th>8Lv</th><th>9Lv</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${currentData.cantrips}</td>
                  ${slotsCells}
                </tr>
              </tbody>
            </table>
          </div>
        `;
      } else if (c.class_id === 'warlock'){
        const currentData = warlockSpellSlotsData[currentLevel - 1];
        const slotsCells = currentData.cantrips;

        spellcastingInfoHtml = `
          <div class="base-info-item full-width">呪文のセーヴ難易度： <span>8 ＋ 習熟ボーナス ＋ 魅力修正値</span></div>
          <div class="base-info-item full-width">呪文攻撃の修正値： <span>習熟ボーナス ＋ 魅力修正値</span></div>
          <div class="base-info-item full-width">初級呪文修得数：<span>${currentData.cantrips}</span></div>
          <div class="base-info-item full-width">1Lv.以上の合計呪文修得数：<span>${currentData.known}</span></div>
          <div class="base-info-item full-width">妖術修得数：<span>${currentData.invocations}</span></div>
          <div class="base-info-item full-width">呪文スロット：<span>${currentData.slots}（${currentData.slotLevel}Lv）</span></div>
        `;
      }

      // サブクラスドロップダウンのHTML構築
      const archetypeOptionsHtml = `
        <option value="" ${selectedArchetypeId === '' ? 'selected' : ''}>基本特徴のみ</option>
        ${c.archetypes.map(a => `<option value="${a.id}" ${a.id === selectedArchetypeId ? 'selected' : ''}>${a.name}</option>`).join('')}
      `;

      const baseInfoPanel = `
        <div class="base-info-panel">
          <div class="base-info-grid">
            <div class="base-info-item">体力 (主クラス/副クラス)： <span>${hpMain}</span> / <span>${hpSub}</span></div>
            <div class="base-info-item">ヒット・ダイス： <span>${hitDiceStr}</span></div>
            <div class="base-info-item">習熟セーヴ： <span>${c.saving_throws.join(', ')}</span></div>
            <div class="base-info-item">鎧習熟： <span>${c.proficiencies ? c.proficiencies.armor : '―'}</span></div>
            <div class="base-info-item">武器習熟： <span>${c.proficiencies ? c.proficiencies.weapons : '―'}</span></div>
            <div class="base-info-item">道具習熟： <span>${c.proficiencies ? c.proficiencies.tools : '―'}</span></div>
            <div class="base-info-item full-width">技能一覧： 次の中から<span>${c.skill_choices.count}</span>個選択 (${c.skill_choices.options.join('、')})</div>
            ${spellcastingInfoHtml}
          </div>
        </div>
      `;

      let tabsNav = `<button class="tab-button active" onclick="switchTab(event, '${c.class_id}', 'base')">基本特徴</button>`;
      if (stylesHtml) {
        tabsNav += `<button class="tab-button" onclick="switchTab(event, '${c.class_id}', 'styles')">戦闘スタイル</button>`;
      }
      archetypeHtmls.forEach(a => {
        tabsNav += `<button class="tab-button" onclick="switchTab(event, '${c.class_id}', '${a.id}')">${a.name}</button>`;
      });

      let tabsContent = `
        <div id="${c.class_id}-base" class="tab-content active">
          ${baseInfoPanel}
          <table>
            <thead>
              <tr>
                <th>Lv</th>
                <th>特徴名</th>
                <th>
                  <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                    <span>効果・解説</span>
                    <div style="display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 0.85rem;">
                      <label for="archetype-select-${c.class_id}" style="margin: 0; color: var(--text-muted); white-space: nowrap;">追加表示(${c.archetype_title}):</label>
                        <select id="archetype-select-${c.class_id}" onchange="handleArchetypeChange('${c.class_id}', this.value)" onclick="event.stopPropagation()" style="padding: 4px 8px; font-size: 0.85rem; background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px;">
                          ${archetypeOptionsHtml}
                        </select>
                    </div>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody>${baseRows || '<tr><td colspan="3" class="no-results">このレベル以下で取得可能な特徴はありません</td></tr>'}</tbody>
          </table>
        </div>
      `;

      if (stylesHtml) {
        tabsContent += `
          <div id="${c.class_id}-styles" class="tab-content">
            <table>
              <thead><tr><th>Lv</th><th>スタイル名</th><th>効果・解説</th></tr></thead>
              <tbody>${stylesHtml}</tbody>
            </table>
          </div>
        `;
      }

      archetypeHtmls.forEach(a => {
        tabsContent += `
          <div id="${c.class_id}-${a.id}" class="tab-content">
            <div class="archetype-desc">${a.desc}</div>
            <table>
              <thead><tr><th>Lv</th><th>特徴名</th><th>効果・解説</th></tr></thead>
              <tbody>${a.rows || '<tr><td colspan="3" class="no-results">このレベル以下で取得可能な特徴はありません</td></tr>'}</tbody>
            </table>
          </div>
        `;
      });

      section.innerHTML = `
        <div class="class-header">
          <h2 class="class-title">${c.class_name}</h2>
          <div class="class-meta">${metaInfo}</div>
        </div>
        <div class="tab-container">${tabsNav}</div>
        ${tabsContent}
      `;

      app.appendChild(section);
    });

    if (!hasResults) {
      app.innerHTML = '<div class="no-results">条件に一致する特徴が見つかりませんでした。</div>';
    }
  }

  window.switchTab = function(event, classId, tabType) {
    const container = event.target.closest('.class-section');
    container.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    container.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    const targetTab = container.querySelector(`#${classId}-${tabType}`);
    if (targetTab) {
      targetTab.classList.add('active');
    }
  };

  classFilter.addEventListener('change', render);
  levelFilter.addEventListener('change', render);
  conModInput.addEventListener('input', render);
  searchInput.addEventListener('input', render);

  initFilters();
  render();
  </script>
</body>
</html>
